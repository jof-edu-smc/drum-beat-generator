steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - '-t'
      - gcr.io/$PROJECT_ID/github.com/jof-edu-smc/backend-$REPO_NAME:$COMMIT_SHA
      - '-f'
      - Dockerfile
      - .
    dir: backend
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/github.com/jof-edu-smc/backend-$REPO_NAME:$COMMIT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    args:
      - run
      - deploy
      - backend-service
      - '--image=gcr.io/$PROJECT_ID/github.com/jof-edu-smc/backend-$REPO_NAME:$COMMIT_SHA'
      - '--region=europe-west1'
      - '--cpu=4'
      - '--memory=16Gi'
      - '--gpu=1'
      - '--gpu-type=nvidia-l4'
      - '--no-gpu-zonal-redundancy'
      - '--allow-unauthenticated'
      - '--set-env-vars=^;^GCS_MODEL_WEIGHTS=$_GCS_MODEL_WEIGHTS;GOOGLE_CLIENT_ID=$_GOOGLE_CLIENT_ID;ALLOWED_ORIGINS=$_ALLOWED_ORIGINS;GCS_GENERATED_MIDI=$_GCS_GENERATED_MIDI;DEV=$_DEV;API_RATE_LIMIT=$_API_RATE_LIMIT;GENERATION_SERVICE_URL=$_GENERATION_SERVICE_URL'
    entrypoint: gcloud
timeout: 1200s
images:
  - gcr.io/$PROJECT_ID/github.com/jof-edu-smc/backend-$REPO_NAME:$COMMIT_SHA
options:
  logging: CLOUD_LOGGING_ONLY
