steps:
  # 1. Build the container image using the Dockerfile in the 'backend' directory
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/github.com/jof-edu-smc/backend-$REPO_NAME:$COMMIT_SHA'
      - '-f'
      - 'Dockerfile'
      - '.'

  # 2. Push the built image to Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/github.com/jof-edu-smc/backend-$REPO_NAME:$COMMIT_SHA'

  # 3. Deploy the container image to Cloud Run with GPU specifications
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'backend-service'
      - '--image=gcr.io/$PROJECT_ID/github.com/jof-edu-smc/backend-$REPO_NAME:$COMMIT_SHA'
      - '--region=us-central1'
      - '--cpu=4'
      - '--memory=16Gi'
      - '--gpu=1'
      - '--gpu-type=nvidia-l4'
      - '--allow-unauthenticated'

# Store and push the built image reference
images:
  - 'gcr.io/$PROJECT_ID/github.com/jof-edu-smc/backend-$REPO_NAME:$COMMIT_SHA'

# Send build logs strictly to Google Cloud Logging
options:
  logging: CLOUD_LOGGING_ONLY

# Build execution timeout
timeout: '600s'