steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - '-t'
      - gcr.io/$PROJECT_ID/github.com/jof-edu-smc/training:$COMMIT_SHA
      - '-f'
      - Dockerfile
      - .
    dir: training
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/github.com/jof-edu-smc/training:$COMMIT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    args:
      - run
      - deploy
      - training-service
      - '--image=gcr.io/$PROJECT_ID/github.com/jof-edu-smc/training:$COMMIT_SHA'
      - '--region=europe-west1'
      - '--cpu=4'
      - '--memory=16Gi'
      - '--gpu=1'
      - '--gpu-type=nvidia-l4'
      - '--no-gpu-zonal-redundancy'
      - '--allow-unauthenticated'
      - '--set-env-vars=WANDB_MODE=$_WANDB_MODE,MODEL_WEIGHTS_BUCKET=$_MODEL_WEIGHTS_BUCKET,TRAINING_DATA_BUCKET=$_TRAINING_DATA_BUCKET,MIDI_PREFIX=$_MIDI_PREFIX'
      - '--set-secrets=WANDB_API_KEY=weights_and_biases_secret:latest,TRAINING_API_KEY=drumbeat_beat_backend_api_key_secret:latest'
    entrypoint: gcloud
timeout: 1200s
images:
  - gcr.io/$PROJECT_ID/github.com/jof-edu-smc/training:$COMMIT_SHA
options:
  logging: CLOUD_LOGGING_ONLY
