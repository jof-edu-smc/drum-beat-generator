steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/drum-beat-generator/training:$COMMIT_SHA'
      - '-f'
      - 'training/Dockerfile'
      - '.'

  # 2. Push the commit-SHA tagged image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/drum-beat-generator/training:$COMMIT_SHA'

  # 3. Tag the image as 'latest'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'tag'
      - 'gcr.io/$PROJECT_ID/drum-beat-generator/training:$COMMIT_SHA'
      - 'gcr.io/$PROJECT_ID/drum-beat-generator/training:latest'

  # 4. Push the 'latest' tagged image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/drum-beat-generator/training:latest'

images:
  - 'gcr.io/$PROJECT_ID/drum-beat-generator/training:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/drum-beat-generator/training:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'