steps:
  # 1. Build the container image using the Dockerfile in the 'training' directory
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'training'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/github.com/jof-edu-smc/training:$COMMIT_SHA'
      - '-f'
      - 'Dockerfile'
      - '.'

  # 2. Push the built image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/github.com/jof-edu-smc/training:$COMMIT_SHA'

  # 3. Deploy the container image to Cloud Run with GPU specs, env vars, and secrets
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'training-service'
      - '--image=gcr.io/$PROJECT_ID/github.com/jof-edu-smc/training:$COMMIT_SHA'
      - '--region=europe-west1'
      - '--cpu=4'
      - '--memory=16Gi'
      - '--gpu=1'
      - '--gpu-type=nvidia-l4'
      - '--no-gpu-zonal-redundancy'
      - '--allow-unauthenticated'
      - '--env-vars-file=training/env.yaml'
      - '--env-vars=GCS_BUCKET_NAME=$_GCS_BUCKET_NAME'
      - '--set-secrets=WANDB_API_KEY=weights_and_biases_secret:latest'

# Store and push the built image reference
images:
  - 'gcr.io/$PROJECT_ID/github.com/jof-edu-smc/training:$COMMIT_SHA'

# Send build logs strictly to Google Cloud Logging
options:
  logging: CLOUD_LOGGING_ONLY

# Build execution timeout
timeout: '1200s'