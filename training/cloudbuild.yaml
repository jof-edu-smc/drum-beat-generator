steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - '-t'
      - gcr.io/$PROJECT_ID/github.com/jof-edu-smc/training:$COMMIT_SHA
      - '-f'
      - Dockerfile
      - .
    dir: training
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/github.com/jof-edu-smc/training:$COMMIT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    args:
      - run
      - jobs
      - update
      - training-job
      - '--image=gcr.io/$PROJECT_ID/github.com/jof-edu-smc/training:$COMMIT_SHA'
      - '--region=us-east4'
      - '--cpu=4'
      - '--memory=16Gi'
      - '--gpu=1'
      - '--gpu-type=nvidia-l4'
      - '--no-gpu-zonal-redundancy'
      - '--set-secrets=WANDB_API_KEY=weights_and_biases_secret:latest'
    entrypoint: gcloud
timeout: 1200s
images:
  - gcr.io/$PROJECT_ID/github.com/jof-edu-smc/training:$COMMIT_SHA
options:
  logging: CLOUD_LOGGING_ONLY